name: CI

on:
  push:
    branches:
      - main
      - develop
      - ft/precomit
  pull_request:

concurrency:
  group: main-klik_pos-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # crenya's shared Frappe CI: own ports + bench per job on crenya-ci, a saved Frappe/ERPNext site,
  # fails when no tests ran. One fix there reaches every app.
  tests:
    uses: codfatherlogic/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: klik_pos
      frappe_versions: '["version-15"]'
      draft_frappe_versions: '["version-15"]'
      runs_on: '"ubuntu-latest"'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit
      run: pre-commit run --all-files
